name: Verify Español · Colombia

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, Updates]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static ES module, PWA manifest & TTS freeze checks
        run: python scripts/verify-app.py
