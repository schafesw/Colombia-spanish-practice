name: Verify Español · Colombia

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, Updates]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static ES module, PWA manifest, version & TTS freeze checks
        run: python scripts/verify-app.py
      - name: Install Playwright Chromium for browser smoke test
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
      - name: Run headless Chromium smoke tests
        run: python scripts/browser_smoke.py
